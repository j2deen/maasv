[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maev"
version = "0.3.0"
description = "MAEV — Memory Architecture for Evolving Agents. Memory lifecycle engine for AI agents."
requires-python = ">=3.11"
license = {text = "BSL-1.1"}
authors = [
    {name = "Adam Bell"},  # original maasv architecture
]
maintainers = [
    {name = "Jay Deen"},
]
readme = "README.md"
keywords = ["memory", "knowledge-graph", "ai-agents", "cognition", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "sqlite-vec>=0.1.1,<1.0",
]

[project.optional-dependencies]
reranking = [
    "sentence-transformers>=2.0.0",
    # NOTE: pulls in torch (~2GB). Only needed if cross_encoder_enabled=True.
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
voyage = ["voyageai>=0.3"]
mcp = [
    "mcp[cli]>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]
all = ["maev[anthropic,mcp,server,voyage]"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
maev-mcp = "maev.mcp_server.server:run"
maev-server = "maev.server.main:run"

[project.urls]
Repository = "https://github.com/j2deen/maev"

[tool.setuptools.packages.find]
include = ["maev*"]
exclude = ["scripts*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
